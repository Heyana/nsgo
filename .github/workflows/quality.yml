name: Repository quality

# Checks workflows, the install script, dependencies, backend duplication and the Android runtime artifacts.

on:
  pull_request:
  # The merge queue tests each pull request on top of the ones ahead of it before it lands on main.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow validation
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows and their shell scripts
        env:
          # Skip style suggestions, but fail on shell correctness warnings and errors.
          SHELLCHECK_OPTS: --severity=warning
        run: actionlint -color

  install-script:
    name: Install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs it with dash and macOS with its own sh, BSD tar and shasum.
        os: [depot-ubuntu-24.04, depot-macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint website/public/install.sh, served at nsgo.dev/install.sh
        if: runner.os == 'Linux'
        run: shellcheck website/public/install.sh website/scripts/test-install.sh
      - name: Install from fake releases served locally
        run: sh website/scripts/test-install.sh

  platform-duplicates:
    name: Shared backend code
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Find new duplicate backend functions
        env:
          NSGO_PLATFORM_DUPLICATES_BASE: HEAD^1
        run: go tool nsgo test -run '^TestPlatformFunctionDuplicates$' ./internal/moduletest

  dependencies:
    name: Dependency review
    # It compares a pull request's base and head; a push has nothing to compare.
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  android-runtime:
    name: Android runtime binaries
    # classes.dex and classes.jar, rebuilt from main, are committed only in a release's chore/release-X.Y.Z pull request, which tools/changelog release fills, or a bot/android-runtime one; one from anywhere else makes every other Android pull request conflict, as Git cannot merge binaries.
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base: their difference is what the pull request changes.
          fetch-depth: 2
      - name: Check the pull request leaves the runtime's binaries alone
        env:
          BOT: ${{ github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'bot/android-runtime' || startsWith(github.head_ref, 'chore/release-')) }}
        run: |
          set -euo pipefail
          [ "$BOT" = true ] && exit 0
          runtime=internal/platform/android/runtime
          changed=$(git diff --name-only HEAD^1 HEAD -- "$runtime/classes.dex" "$runtime/classes.jar" | tr '\n' ' ')
          if [ -n "$changed" ]; then
            # A warning while pull requests opened before this check still carry the binaries; it becomes an error once they have merged or dropped them.
            echo "::warning::This pull request changes ${changed}which a release's changelog pull request or a bot/android-runtime one rebuilds after merge. Drop them with: git checkout origin/main -- $runtime/classes.dex $runtime/classes.jar"
          fi
