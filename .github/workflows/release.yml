name: Release

# Tags and publishes a release, only once every check has passed. A maintainer decides the version: `go run ./tools/changelog release X.Y.Z` folds changelog.d's fragments into CHANGELOG.md and turns its `## [Unreleased]` into `## [X.Y.Z] - YYYY-MM-DD` above a fresh `## [Unreleased]`; they merge that to main, then run this workflow on main with that version (`gh workflow run release.yml -f version=X.Y.Z`).
#
# The run refuses a malformed version, a ref other than main, a commit that is no longer main's tip, a tag that already exists and a version the Go module proxy already serves. It then refuses fragments left uncollected, a missing changelog section and an Android runtime not built from its Java, and runs every job of test.yml, the Apple jobs pull requests skip included. Beside the tests it builds the prebuilt nsgo binaries from the tested commit (release-assets.yml): an archive per platform and checksums.txt. Only after all of that passes does it create the annotated tag vX.Y.Z on the tested commit, publish the section as the release's notes with those archives attached (a prerelease for a version with a suffix such as -rc.1) and ask the proxy for the version so pkg.go.dev lists it. A tag created with GITHUB_TOKEN starts no workflow, so this same run publishes it.
#
# Pushing a tag vX.Y.Z on main still runs the same checks and publishes, for compatibility, but the version is public from the push on: the proxy may cache it before any check runs, and a failure then burns the version for good, as happened to v0.3.1 and v0.3.2 (#2380).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, X.Y.Z or X.Y.Z-suffix, without the v; CHANGELOG.md on main must have its section."
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# One run per version, whichever way it started.
concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notes:
    name: Check the version and its notes
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          # Passed through the environment, never into the script's text, as the input is free text.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            tag=$GITHUB_REF_NAME
            version=${tag#v}
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$tag points at $GITHUB_SHA, which is not on main. Tag a commit of main."
              exit 1
            fi
          else
            version=$INPUT_VERSION
            tag=v$version
            if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$version' is not a version: give X.Y.Z or X.Y.Z-suffix, without the v."
              exit 1
            fi
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::The release runs on main, not $GITHUB_REF. Run it with --ref main."
              exit 1
            fi
            # The commit tested is the one tagged, so it must be what main holds now, not a commit main has moved past since the run was queued.
            tip=$(git rev-parse origin/main)
            if [ "$GITHUB_SHA" != "$tip" ]; then
              echo "::error::The run is on $GITHUB_SHA, but main's tip is now $tip. Run the release again."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::The tag $tag already exists. Pick the next version."
              exit 1
            fi
            # Exit code 2 means the remote has no such ref; anything else but 0 is a failure to ask.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::The remote already has the tag $tag. Pick the next version."
              exit 1
            elif [ "$status" -ne 2 ]; then
              echo "::error::git ls-remote failed with $status, so whether $tag exists is unknown."
              exit 1
            fi
            # A version the proxy has cached is recorded in the checksum database, so it can never point at another commit, even with its tag deleted. Disable-Module-Fetch asks the proxy's cache alone, so the question neither fetches the version nor caches its absence.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 -H 'Disable-Module-Fetch: true' "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/@v/${tag}.info")
            case "$code" in
              200)
                echo "::error::proxy.golang.org already serves $tag, so the version is taken for good. Pick the next version."
                exit 1 ;;
              404 | 410) ;;
              *)
                echo "::error::proxy.golang.org answered $code, so whether it serves $tag is unknown."
                exit 1 ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check every fragment was collected
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The notes come from CHANGELOG.md alone, so a fragment left in changelog.d would be missing from them.
          left=$(find changelog.d -maxdepth 1 -type f -name '*.md' ! -name README.md -printf '%f ')
          if [ -n "$left" ]; then
            echo "::error::changelog.d still holds ${left}Run go run ./tools/changelog release $VERSION and merge it before releasing."
            exit 1
          fi
      - name: Extract the changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The section runs from its heading to the next version's heading, without either.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section with notes. Add it on main before releasing."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
          retention-days: 7

  android-runtime:
    name: Check the Android runtime is current
    # Pull requests no longer commit classes.dex and classes.jar (#1759); `go run ./tools/changelog release` rebuilds them with android-runtime.yml when the Java changed since their last rebuild, deciding from Git history, and this exact comparison is the guard behind it. A release whose committed binaries were not built from its own Java would ship a runtime that does not match its sources, so this rebuilds them and refuses the release when they differ.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # The JDK the committed runtime is built with, as in test.yml's android job, so javac gives the same class files.
          java-version: '21'
      - name: Rebuild the runtime and compare it with the committed one
        run: |
          set -euo pipefail
          runtime=internal/platform/android/runtime
          committed="$RUNNER_TEMP/committed"
          mkdir -p "$committed"
          cp "$runtime/classes.dex" "$runtime/classes.jar" "$committed/"
          # The same build as test.yml's android job and android-runtime.yml, which also installs the SDK packages the runner image lacks.
          .github/scripts/build-android-runtime.sh
          dexdump=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name dexdump | sort -V | tail -n 1)
          if [ -z "$dexdump" ]; then
            echo "::error::No dexdump in $ANDROID_HOME/build-tools, so the committed classes.dex cannot be compared."
            exit 1
          fi

          # The jar holds javac's class files, which a JDK 21 compiles the same on any machine, so its entries' checksums of their uncompressed bytes must match exactly; the archive's own bytes are not compared, as they depend on the jar tool's compressor.
          entries() { unzip -v "$1" | awk 'length($7) == 8 && $7 ~ /^[0-9a-f]+$/ { print $7, $8 }'; }
          # d8 writes its version into the dex and its register allocation and instruction choice change between releases, so the runner's d8 and a maintainer's give different bytes for the same classes. Compare what d8 keeps from the classes instead: every class, its superclass, interfaces and flags, and every field and method with its type and flags. The helper classes d8 adds under com.android.tools.r8 are its own, not the runtime's, and are left out.
          declarations() {
            "$dexdump" "$1" | awk '
              /^  Class descriptor/ { skip = index($NF, "Lcom/android/tools/r8/") == 2 }
              skip { next }
              /^  (Class descriptor|Access flags|Superclass|Interfaces|Static fields|Instance fields|Direct methods|Virtual methods) / || /^    #[0-9]+ / || /^      (name|type|access) / { print }
            '
          }
          # Listed into files rather than compared through process substitution, so a failing unzip or dexdump stops the step instead of leaving two empty listings that match.
          entries "$committed/classes.jar" > "$RUNNER_TEMP/committed-jar.txt"
          entries "$runtime/classes.jar" > "$RUNNER_TEMP/built-jar.txt"
          declarations "$committed/classes.dex" > "$RUNNER_TEMP/committed-dex.txt"
          declarations "$runtime/classes.dex" > "$RUNNER_TEMP/built-dex.txt"
          for listing in built-jar built-dex; do
            if [ ! -s "$RUNNER_TEMP/$listing.txt" ]; then
              echo "::error::The rebuilt runtime's $listing listing is empty, so it cannot be compared."
              exit 1
            fi
          done
          stale=""
          if ! diff -u "$RUNNER_TEMP/committed-jar.txt" "$RUNNER_TEMP/built-jar.txt"; then
            stale="$stale classes.jar"
          fi
          if ! diff -u "$RUNNER_TEMP/committed-dex.txt" "$RUNNER_TEMP/built-dex.txt"; then
            stale="$stale classes.dex"
          fi
          if [ -n "$stale" ]; then
            echo "::error title=Stale Android runtime::The committed$stale in $runtime at $GITHUB_SHA was not built from this commit's Java. Run go run ./tools/changelog release on main's tip, which rebuilds both with android-runtime.yml, or rebuild them with $runtime/build.sh on main's tip in a bot/android-runtime pull request; then release the merged commit."
            exit 1
          fi
          echo "The committed Android runtime matches the Java of $GITHUB_SHA."

  test:
    name: Test
    needs: notes
    uses: ./.github/workflows/test.yml
    with:
      # Every job, the Apple jobs pull requests skip included: v0.3.2 failed apple-simulator, which no pull request had run.
      all-jobs: true

  assets:
    name: Build the release archives
    needs: notes
    uses: ./.github/workflows/release-assets.yml
    with:
      version: ${{ needs.notes.outputs.version }}

  publish:
    name: Tag and publish the release
    needs: [notes, android-runtime, test, assets]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    # The only job that writes: it creates the tag and the release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.notes.outputs.version }}
      TAG: ${{ needs.notes.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Check the archives against their checksums
        working-directory: assets
        run: |
          set -euo pipefail
          # The six archives and checksums.txt the assets job verified, checked again after the artifact's round trip and before anything is tagged.
          sha256sum -c --strict checksums.txt
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 7 ]; then
            echo "::error::The release-assets artifact holds $count files, want six archives and checksums.txt."
            exit 1
          fi
      - name: Create the tag on the tested commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # The tests took long enough for main to move on, which is fine, but the tested commit must still be on it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$status" in
            ahead | identical) ;;
            *)
              echo "::error::$GITHUB_SHA is no longer on main ($status). Run the release again."
              exit 1 ;;
          esac
          # Asked again, as the notes job did, in case the version was taken while the tests ran.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 -H 'Disable-Module-Fetch: true' "https://proxy.golang.org/github.com/${GITHUB_REPOSITORY}/@v/${TAG}.info")
          if [ "$code" != 404 ] && [ "$code" != 410 ]; then
            echo "::error::proxy.golang.org answered $code for $TAG, so the version may be taken. Nothing was tagged."
            exit 1
          fi
          # An annotated tag, as maintainers' tags are, created through the API rather than a push, so the job needs no credentials in a checkout. Creating a ref that exists fails, so a tag made since the notes job is never moved.
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="NSGo $VERSION" -f object="$GITHUB_SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          echo "Tagged $GITHUB_SHA as $TAG."
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          # With assets, gh creates the release as a draft, uploads them and only then publishes it; a failed upload deletes the draft and fails the step, so no release is ever public without its archives.
          gh release create "$TAG" --verify-tag --title "NSGo $VERSION" --notes-file notes.md "${prerelease[@]}" assets/*
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Announce the version to the Go module proxy
        run: |
          set -euo pipefail
          # The proxy fetches the tag on first request, after which pkg.go.dev picks the version up. Retry, since the proxy may not see a tag created seconds ago.
          for _ in 1 2 3 4 5; do
            GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/${GITHUB_REPOSITORY}@${TAG}" && exit 0
            sleep 30
          done
          echo "::warning::The module proxy did not list $TAG yet; it will on the first request that needs it."

  burned:
    name: Report a burned version
    # A pushed tag is public before any check runs, so a failure after the push leaves a version the proxy may already serve and that cannot be released again.
    needs: [notes, android-runtime, test, assets, publish]
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Say the version is already public
        run: |
          set -euo pipefail
          message="$GITHUB_REF_NAME failed its release after the tag was pushed, so the version is already public: the Go module proxy may serve it, and it cannot be tagged again on another commit. Fix the failure on main and release the next version with gh workflow run release.yml -f version=X.Y.Z, which tags only after every check passes."
          echo "::error title=Version already public::$message"
          {
            echo "## $GITHUB_REF_NAME is already public"
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"
