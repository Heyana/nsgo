name: Registry

# Checks weekly, on demand, and on pull requests changing cmd/nsgo/registry.yaml that every library and component listed in NSGo's built-in index still resolves to a release tag without repository redirects, keeps apps on a released NSGo, has valid manifests, and checks for linux_x64.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - cmd/nsgo/registry.yaml

concurrency:
  group: registry-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  registry:
    name: Check registry
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check registry entries
        env:
          NSGO_REGISTRY_ONLINE: '1'
        run: go tool nsgo test -run '^TestRegistryOnline$' ./cmd/nsgo -- -count=1 -timeout=25m
