name: CodeQL

# Static analysis of the Go code, the website's and the TSX runtime's JavaScript and TypeScript, and the workflows themselves. Whether its results block a merge is a ruleset's decision, not this file's.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - docs/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - docs/**
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  # Only a pull request's newer push makes an older scan pointless; a scan of main is the branch's record and finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Go has no buildless mode: autobuild compiles the module for Linux, which needs no cgo or system libraries, as the backends reach the system through purego.
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Check whether the pull request still accepts results
        if: github.event_name == 'pull_request'
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Queued scans can start after merge. Keep analyzing, but GitHub no longer accepts their PR results.
          state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .state)
          case "$state" in
            open) echo 'mode=always' >> "$GITHUB_OUTPUT" ;;
            closed)
              echo 'mode=never' >> "$GITHUB_OUTPUT"
              echo '::notice::Pull request is closed; analyze without uploading its results.'
              ;;
            *) echo "::error::Unexpected pull request state: $state"; exit 1 ;;
          esac
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ steps.upload.outputs.mode || 'always' }}
          upload-database: ${{ steps.upload.outputs.mode != 'never' }}
