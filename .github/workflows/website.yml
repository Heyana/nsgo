name: Website

# Auto-deploy is temporarily disabled: restore the push trigger to publish on main again.
on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "**/*.go"
  #     - "go.mod"
  #     - "go.sum"
  #     - "examples/gallery/**"
  #     - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build the gallery for the web
        run: go tool nsgo build -target web -name NSGo -open=false -output dist examples/gallery

      - name: Collect the site
        run: |
          mkdir site
          cp -R examples/gallery/dist/*-web/. site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
