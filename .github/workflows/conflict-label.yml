name: Conflict label

# Labels pull requests that conflict with their base branch and removes the label once the conflict is resolved.
#
# A pull request's own push checks only that pull request, one read and at most one label edit. A scheduled run checks every open pull request, so a push to main reaches the others within fifteen minutes without every push and every pull request synchronize scanning all of them. That scan is what exhausted the installation's API rate limit and made the main runs of CodeQL and Pages fail.
#
# Whether a pull request conflicts is GitHub's mergeable field. Right after a push it may still be null while GitHub computes it in the background; the job reads it again a few times and leaves what stays unknown to the next run.
#
# pull_request_target gives fork pull requests a write token for labels; the job never checks out or runs a pull request's code and only calls GitHub's API.

on:
  schedule:
    - cron: "*/15 * * * *"
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  # A pull request's run and the schedule's run are separate: only the newest schedule matters, and a pull request's older run is replaced by its next event.
  group: conflict-label-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || 'schedule' }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label conflicting pull requests
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: conflict
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Ensure the label exists
        run: gh label create "$LABEL" --color B60205 --description "Conflicts with the base branch; resolve it first" --force

      - name: Label pull requests by their mergeable state
        run: |
          set -euo pipefail
          # Lists, GraphQL's included, never make GitHub compute mergeable and keep it UNKNOWN; only GET /pulls/{number} does. It also carries the labels, so one request per pull request answers both.
          # The API now and then answers with an error page that is not JSON. Retry a read after 10 seconds while it is null, at most 4 times, and treat a pull request that fails to read as not computed yet rather than failing the whole job.
          label_pr() {
            number=$1
            mergeable=null
            labelled=false
            for attempt in 1 2 3 4; do
              # The parse sits inside the condition so a body that is not JSON counts as not computed instead of tripping set -e.
              if ! { response=$(gh api "repos/$GH_REPO/pulls/$number" 2>/dev/null) \
                && mergeable=$(printf '%s' "$response" | jq -r '.mergeable | tostring') \
                && labelled=$(printf '%s' "$response" | jq -r --arg label "$LABEL" 'any(.labels[]; .name == $label) | tostring'); }; then
                mergeable=null
              fi
              [ "$mergeable" != null ] && break
              [ "$attempt" = 4 ] || sleep 10
            done
            if [ "$mergeable" = false ] && [ "$labelled" = false ]; then
              gh pr edit "$number" --add-label "$LABEL" >/dev/null && echo "#$number conflicts; added $LABEL"
            elif [ "$mergeable" = true ] && [ "$labelled" = true ]; then
              gh pr edit "$number" --remove-label "$LABEL" >/dev/null && echo "#$number no longer conflicts; removed $LABEL"
            elif [ "$mergeable" = null ]; then
              echo "#$number: mergeable state not computed yet; leaving it to the next run"
            fi
          }
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ] && [ -n "$PR_NUMBER" ]; then
            # The pull request's own push or label pass touches only it.
            label_pr "$PR_NUMBER"
          else
            # The schedule catches pull requests a push to main made conflict.
            for attempt in 1 2 3 4; do
              numbers=$(gh pr list --state open --limit 500 --json number --jq '.[].number') && break
              [ "$attempt" = 4 ] && exit 1
              sleep 10
            done
            while read -r number; do
              [ -n "$number" ] && label_pr "$number"
            done <<< "$numbers"
          fi
