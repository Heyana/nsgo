name: Android runtime

# Keeps the prebuilt Android runtime on main current with its Java. Users cannot build classes.dex and classes.jar with Go and Xcode, so they stay committed, but pull requests no longer commit them, as Git cannot merge binaries and every such merge made the other Android pull requests conflict. After a push to main changes the Java or the runtime, this rebuilds both with build.sh from main's tip and, when they differ, force-pushes them to bot/android-runtime and opens or updates a pull request that auto-merges once its checks pass.
#
# It pushes as a GitHub App installed on this repository, whose token, unlike GITHUB_TOKEN's, starts the required checks on the pull request; main's protection is unchanged. Without the NSGO_BOT_APP_ID and NSGO_BOT_PRIVATE_KEY secrets it skips with a notice.

on:
  push:
    branches:
      - main
    paths:
      - internal/platform/android/java/**
      - internal/platform/android/runtime/**
  workflow_dispatch:

# One rebuild at a time; a push while one runs queues the newest, which supersedes any queued before it.
concurrency:
  group: android-runtime
  cancel-in-progress: false

permissions:
  contents: read

env:
  BRANCH: bot/android-runtime
  RUNTIME: internal/platform/android/runtime

jobs:
  rebuild:
    name: Rebuild and propose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check for the App's secrets
        id: app
        env:
          APP_ID: ${{ secrets.NSGO_BOT_APP_ID }}
          APP_KEY: ${{ secrets.NSGO_BOT_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::notice::Skipped: the NSGO_BOT_APP_ID and NSGO_BOT_PRIVATE_KEY secrets are not set, so the Android runtime on main is not rebuilt. Rebuild it by hand with $RUNTIME/build.sh until the App is installed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out main's tip
        if: steps.app.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The newest main rather than the pushed commit, so a queued run never proposes binaries older than main's Java.
          ref: main
          persist-credentials: false
      - name: Set up Java
        if: steps.app.outputs.ready == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # The JDK the committed runtime is built with, so a rebuild of unchanged Java gives the same bytes.
          java-version: '21'
      - name: Build the runtime
        if: steps.app.outputs.ready == 'true'
        id: build
        run: |
          set -euo pipefail
          # build.sh needs platform 36 and a d8 from cmdline-tools or build-tools 36+; install what the runner image lacks.
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ] || { [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/d8" ] && ! ls "$ANDROID_HOME"/build-tools/3[6-9]*/d8 >/dev/null 2>&1; }; then
            (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi
          "$RUNTIME/build.sh"
          if git diff --quiet -- "$RUNTIME/classes.dex" "$RUNTIME/classes.jar"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Get the App's token
        if: steps.app.outputs.ready == 'true'
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.NSGO_BOT_APP_ID }}
          private-key: ${{ secrets.NSGO_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the pull request
        if: steps.app.outputs.ready == 'true' && steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- "$RUNTIME/classes.dex" "$RUNTIME/classes.jar"
          git commit -q -m "chore(android): rebuild the runtime" -m "Built by $RUNTIME/build.sh from the Java of $SHA."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Rebuilds \`classes.dex\` and \`classes.jar\` with \`$RUNTIME/build.sh\` from the Java of $SHA, so the runtime Go modules embed matches its sources.

          Opened by android-runtime.yml, which force-pushes this branch after each change to the Android Java on main; it merges itself once its checks pass.
          EOF
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "chore(android): rebuild the runtime" --body-file "$RUNNER_TEMP/body.md"
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --rebase
          echo "::notice::Proposed the rebuilt Android runtime in #$pr."
      - name: Close a pull request main no longer needs
        if: steps.app.outputs.ready == 'true' && steps.build.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "main's committed runtime already matches its Java."
          fi
          echo "::notice::The Android runtime on main matches its Java."
