name: Check

# Checks Go formatting and builds and vets every target; test.yml runs the tests. The Apple job skips a pull request that cannot affect Apple's targets (apple-changes.yml).
on:
  pull_request:
  push:
    branches:
      - main
  # The merge queue tests each pull request on top of the ones ahead of it before it lands on main.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Apple changes
    uses: ./.github/workflows/apple-changes.yml

  format:
    name: Go formatting
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check tracked Go files
        shell: bash
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

  # go tool nsgo check -target all names the targets a Mac with Go and Xcode builds (cmd/nsgo/build.go, goAndXcodeTargets), and Apple's need cgo against Xcode's SDKs, which Linux has none of. So Linux vets the rest and a Mac only Apple's, side by side; a target added to cmd/nsgo/build.go's targets joins one of the two lists here.
  check:
    name: Build and vet
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and vet every target but Apple's mobile ones
        run: go tool nsgo check -target macos_arm64,macos_x64,windows_arm64,windows_x64,linux_arm64,linux_x64,android_arm64,web,harmonyos
      - name: Check the benchmark module
        run: go list -mod=readonly ./...
        working-directory: benchmark

  apple:
    name: Build and vet (Apple)
    needs: changes
    # Skips a pull request that cannot affect Apple's targets (apple-changes.yml); a failed changes job runs it.
    if: ${{ !cancelled() && needs.changes.outputs.apple != 'false' }}
    runs-on: depot-macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and vet iOS, tvOS and watchOS
        run: go tool nsgo check -target ios,ios_simulator,tvos,tvos_simulator,watchos,watchos_simulator
