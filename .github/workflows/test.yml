name: Test

# Tests every package on Linux, Apple's backends on macOS, Android presses on an emulator, and native input regressions across desktops and the web, the browsers in a job of their own. It does not run again on main, which takes the commits the merge queue tested as they are. release.yml calls it with all-jobs before tagging a release. The Apple jobs skip a pull request that cannot affect Apple's targets (apple-changes.yml), and apple-simulator skips every pull request, unless all-jobs is set.
on:
  pull_request:
  # The merge queue tests each pull request on top of the ones ahead of it before it lands on main.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      all-jobs:
        description: "Run every job whatever the change touches, as a release must: the Apple jobs and apple-simulator included."
        type: boolean
        default: false

# A pull request's newer push cancels its older run. A merge group's run is keyed on its own gh-readonly-queue branch, so it never cancels or is cancelled by another.
concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Apple changes
    uses: ./.github/workflows/apple-changes.yml
  gallery:
    name: Gallery (${{ matrix.target }}, shard ${{ matrix.shard }})
    needs: changes
    # The web shards stand behind the required check Gallery (web), so they run even when the changes job fails; macOS joins them unless the change cannot affect Apple's targets and all-jobs is unset.
    if: ${{ !cancelled() }}
    # Each web shard reports its own success under its own name, so the gallery-web job can tell the web shards from the macOS ones.
    outputs:
      web_shard_1: ${{ steps.passed.outputs.web_shard_1 }}
      web_shard_2: ${{ steps.passed.outputs.web_shard_2 }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(!inputs.all-jobs && needs.changes.outputs.apple == 'false' && '["web"]' || '["web","macos"]') }}
        # The gallery's tests run in one long step, so two runners take half the list each: names TestA…TestM and TestN…TestZ.
        shard: [1, 2]
    runs-on: ${{ matrix.target == 'macos' && 'depot-macos-26' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Grant the runner the microphone
        if: matrix.target == 'macos'
        run: .github/scripts/grant-microphone.sh
      - name: Select Xcode with Icon Composer
        if: matrix.target == 'macos'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Test gallery on the target
        env:
          GALLERY_TESTS: ${{ matrix.shard == 1 && '^Test[A-M]' || '^Test[N-Z]' }}
        run: go tool nsgo test -target ${{ matrix.target }} -run "$GALLERY_TESTS" -junit "$RUNNER_TEMP/gallery.xml" -screenshots gallery-screenshots ./examples/gallery
      - name: Test formula layout and display wrapping
        if: matrix.shard == 1
        run: go tool nsgo test -target ${{ matrix.target }} -screenshots formula-screenshots ./base/formula
      - name: Test terminal actions on macOS
        if: matrix.target == 'macos' && matrix.shard == 1
        run: go tool nsgo test -target macos -run '^TestTerminal(KeybindOverridesZoomAndFocus|DefaultContextMenuActionsAndLanguage|SecondaryClickPolicyAndCustomMenu)$' -screenshots terminal-actions-screenshots ./base/terminal -- -count=1
      - name: Run the many-sprite and mesh canvas scenarios
        if: matrix.shard == 1
        env:
          NSGO_GALLERY_PERF: '1'
          NSGO_GALLERY_PERF_SECONDS: '3'
        run: go tool nsgo test -target ${{ matrix.target }} -fps -env NSGO_GALLERY_PERF=1 -env NSGO_GALLERY_PERF_SECONDS=3 -run '^TestPerfCanvas(Sprites|Mesh)' ./examples/gallery
      - name: Record that the shard passed
        id: passed
        run: echo "${{ matrix.target }}_shard_${{ matrix.shard }}=success" >> "$GITHUB_OUTPUT"
      - name: Keep results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-${{ matrix.target }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/gallery.xml
            gallery-screenshots
            formula-screenshots
            terminal-actions-screenshots
          if-no-files-found: warn
  gallery-web:
    # The required check: it passes only when every web shard of the gallery job passed, so the merge queue keeps gating on the whole gallery on the web. It runs whatever happened before it, as a skipped required check would count as passed, except in a cancelled run, where it ends cancelled with the shards instead of failing. A shard that runs out of time ends cancelled too, but the run goes on, so this job still runs and fails.
    name: Gallery (web)
    needs: gallery
    if: ${{ !cancelled() }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every web shard to pass
        env:
          SHARD_1: ${{ needs.gallery.outputs.web_shard_1 }}
          SHARD_2: ${{ needs.gallery.outputs.web_shard_2 }}
        run: |
          if [ "$SHARD_1" != success ] || [ "$SHARD_2" != success ]; then
            echo "::error::A web shard of the gallery did not pass: shard 1 '$SHARD_1', shard 2 '$SHARD_2'."
            exit 1
          fi
  test:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Java for Android runtime tests
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor at-spi2-core libgtk-4-dev libgtk-4-media-gstreamer libwebkitgtk-6.0-4 libsoup-3.0-0 xvfb x11-xkb-utils openbox pulseaudio gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio gstreamer1.0-libav desktop-file-utils shared-mime-info libglib2.0-bin libdbusmenu-glib4 avahi-daemon dbus openbox gnome-sushi sway
      - name: Allow WebKit's sandbox on the runner
        run: |
          # Ubuntu restricts unprivileged user namespaces. Grant bubblewrap that permission so WebKit can keep its sandbox enabled.
          sudo tee /etc/apparmor.d/nsgo-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile nsgo-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/nsgo-ci-bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / /usr/bin/true
      - name: Test native Sushi file previews
        env:
          SUSHI_PERSIST: '1'
          NSGO_TEST_SUSHI: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a dbus-run-session -- go tool nsgo test -run '^TestQuickLookWithSushi$' ./internal/platform/linux -- -count=1 -timeout=90s
      - name: Start a virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nsgo_test
          pactl set-default-sink nsgo_test
      - name: Test native window limits and titlebar buttons
        env:
          GDK_BACKEND: x11
          NSGO_REQUIRE_WINDOW_MANAGER: "1"
        run: |
          xvfb-run -a dbus-run-session -- sh -e <<'SCRIPT'
            openbox --sm-disable > "$RUNNER_TEMP/nsgo-window-limits-openbox.log" 2>&1 &
            manager=$!
            trap "kill $manager 2>/dev/null || true" EXIT
            sleep .5
            kill -0 "$manager"
            go tool nsgo test -run "^TestWindowConstraints" -timeout 2m ./internal/platform/linux
          SCRIPT
      - name: Test HarmonyOS Wasm backend under Node.js
        # The gallery's TestHarmonyOSPages needs an ArkUI emulator connected through hdc, which this runner does not have.
        # Keep the Wasm test process within Go's environment size limit.
        run: >-
          go tool nsgo test -env GOOS=js -env GOARCH=wasm ./internal/platform/harmonyos
          -- "-exec=env -i \"PATH=$PATH\" \"$(go env GOROOT)/lib/wasm/go_js_wasm_exec\"" -count=1
      - name: Test headless press routing, modifiers and visible labels
        run: go tool nsgo test ./internal/testhost/testdata/press
      - name: Test native press routing, modifiers and visible labels
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/press
      - name: Test native local service discovery
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          if [[ ! -S /run/dbus/system_bus_socket ]]; then
            sudo install -d /run/dbus
            sudo dbus-daemon --system --fork
          fi
          sudo avahi-daemon --check || sudo avahi-daemon --daemonize --no-rlimits
          xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/discovery
      - name: Test headless editing keys and bindings
        run: go tool nsgo test ./internal/testhost/testdata/keys
      - name: Test native editing keys and bindings
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NSGO_TEST_XKB_LAYOUTS: '1'
        run: xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/keys
      - name: Test native window state and non-activating panels
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail <<'SH'
          openbox --sm-disable >/tmp/nsgo-windowstate-wm.log 2>&1 &
          task_wm_pid=$!
          trap 'kill "$task_wm_pid" 2>/dev/null || true; wait "$task_wm_pid" 2>/dev/null || true' EXIT
          go tool nsgo test -target linux -timeout 2m ./internal/testhost/testdata/windowstate
          SH
      - name: Test native web sources and restricted history
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/websource
          xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/webhistory
      - name: Test native raised sound limits
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/soundlimits
      - name: Test headless photo pick answers
        run: go tool nsgo test ./internal/testhost/testdata/pick
      - name: Test headless network state
        run: go tool nsgo test ./internal/testhost/testdata/network
      - name: Test that pull PCM audio is unsupported headless
        run: go tool nsgo test ./internal/testhost/testdata/audiooutput
      - name: Test native photo pick answers
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/pick
      - name: Test native audio playback controls
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          PULSE_SINK: nsgo_test
        run: xvfb-run -a go tool nsgo test -target linux -timeout 1m ./internal/testhost/testdata/audio
      - name: Test Linux audio output
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          PULSE_SINK: nsgo_test
        run: xvfb-run -a go tool nsgo test ./internal/platform/linux -run '^TestLinuxAudio' -- -count=1
      - name: Run the many-sprite and mesh canvas scenarios
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          NSGO_GALLERY_PERF: '1'
          NSGO_GALLERY_PERF_SECONDS: '3'
        run: xvfb-run -a go tool nsgo test -target linux -fps -run '^TestPerfCanvas(Sprites|Mesh)' ./examples/gallery
      - name: Compare native Cairo atlas pixels
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux -run '^TestCanvasAtlas(MatchesDrawImageFrom|Sampling)$' ./internal/testhost/testdata/capture
      - name: Test Linux shader pixel frames
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/shaderpixels
      - name: Test Linux owned-window visibility and minimization
        env:
          NSGO_OWNED_WINDOWS_REQUIRE_WM: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          xvfb-run -a sh -eu <<'SCRIPT'
          openbox > "$RUNNER_TEMP/owned-window-manager.log" 2>&1 &
          wm_pid=$!
          trap 'kill "$wm_pid" 2>/dev/null || true' EXIT
          sleep 1
          kill -0 "$wm_pid"
          go tool nsgo test -run '^TestOwnedWindowsFollow' ./internal/platform/linux -- -count=1
          SCRIPT
      - name: Test Linux launcher menus and recent files
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GIO_USE_VFS: local
        run: xvfb-run -a dbus-run-session -- go tool nsgo test -run '^(TestLauncherQuicklistOverDBus|TestRecentFilesPreserveOtherApplications|TestTrayServesItsItemAndMenuOverDBus)$' ./internal/platform/linux
      - name: Test X11 frontmost player states
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          XDG_SESSION_TYPE: x11
          NSGO_FRONTMOST_X11_NATIVE: '1'
        run: |
          unset WAYLAND_DISPLAY
          fixture=$(mktemp -d)
          cat > "$fixture/check.sh" <<'SCRIPT'
          set -eu -o pipefail
          openbox > "$1/openbox.log" 2>&1 &
          manager=$!
          trap 'kill "$manager" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
            if ! kill -0 "$manager"; then cat "$1/openbox.log"; exit 1; fi
            sleep 0.1
          done
          # Settle portal activation before timing GTK window startup.
          timeout 30s gdbus call --session --dest org.freedesktop.portal.Desktop --object-path /org/freedesktop/portal/desktop --method org.freedesktop.DBus.Peer.Ping > "$1/portal.log" 2>&1 || true
          go tool nsgo test -run "^TestX11FrontmostTracksPlayerState$" ./internal/platform/linux -- -count=1
          SCRIPT
          xvfb-run -a dbus-run-session -- bash "$fixture/check.sh" "$fixture"
      - name: Test Wayland frontmost applications
        env:
          GDK_BACKEND: wayland
          GSK_RENDERER: cairo
          GTK_A11Y: none
          WLR_BACKENDS: headless
          WLR_HEADLESS_OUTPUTS: '1'
          WLR_RENDERER: pixman
          WLR_LIBINPUT_NO_DEVICES: '1'
          NSGO_FRONTMOST_WAYLAND_NATIVE: '1'
        run: |
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          chmod 700 "$XDG_RUNTIME_DIR"
          printf '%s\n' 'output * mode 1280x720' 'seat seat0 fallback true' 'focus_follows_mouse no' 'xwayland disable' > "$XDG_RUNTIME_DIR/sway.conf"
          cat > "$XDG_RUNTIME_DIR/check.sh" <<'SCRIPT'
          set -eu -o pipefail
          sway -c "$XDG_RUNTIME_DIR/sway.conf" > "$XDG_RUNTIME_DIR/sway.log" 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          SWAYSOCK=""
          WAYLAND_DISPLAY=""
          for attempt in {1..100}; do
            sockets=("$XDG_RUNTIME_DIR"/sway-ipc.*.sock)
            for candidate in "$XDG_RUNTIME_DIR"/wayland-*; do
              if [[ -S "$candidate" ]]; then WAYLAND_DISPLAY=${candidate##*/}; break; fi
            done
            if [[ -S "${sockets[0]}" && -n "$WAYLAND_DISPLAY" ]]; then SWAYSOCK=${sockets[0]}; break; fi
            if ! kill -0 "$compositor"; then cat "$XDG_RUNTIME_DIR/sway.log"; exit 1; fi
            sleep 0.1
          done
          export SWAYSOCK WAYLAND_DISPLAY
          test -n "$SWAYSOCK"
          test -n "$WAYLAND_DISPLAY"
          go tool nsgo test -run "^TestWaylandFrontmost" ./internal/platform/linux -- -count=1
          SCRIPT
          dbus-run-session -- bash "$XDG_RUNTIME_DIR/check.sh"
      - name: Test Linux display frame timestamps
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux -timeout 1m ./internal/testhost/testdata/frameclock
      - name: Test Linux DevTools presentation bounds
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux -timeout 1m ./testdata/devtools-geometry
      - name: Test native radio and tab focus
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux -run '^(TestRadioGroupIsOneStopItsArrowsMoveThrough|TestTabsTakeHomeEndAndSwapLeftAndRightRightToLeft)$' ./base
      - name: Test canvas image tint on Linux
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux -run '^TestCanvasImageTint$' ./internal/testhost/testdata/capture

  # Vet compiles every host package without running a test, so it shares
  # nothing with the suite and runs beside it on a runner of its own instead of
  # ahead of it. The suite then starts 2m38s earlier, its median wait for the vet.
  vet:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go tool nsgo check

  # The browser tests need Go alone, while the test job above spends most of its time installing and driving GTK, so they run beside it on a runner of their own.
  # The Test step runs the whole suite and takes about 3m49s, while the test job's other steps take about 6 minutes beside it.
  test-suite:
    name: test-suite (${{ matrix.name }})
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            packages: ". ./cmd/... ./examples/... ./ui/... ./tsx/... ./web/... ./automation/... ./microphone/..."
          - name: core
            packages: "./internal/... ./base/... ./core/... ./gpu/... ./nsgotest/... ./tools/... ./cloud/... ./audio/... ./desktop/... ./gamepad/... ./i18n/... ./icons/... ./widget/... ./mobile/... ./targets/... ./updater/... ./gameservices/..."
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Java for Android runtime tests
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor at-spi2-core libgtk-4-dev libgtk-4-media-gstreamer libwebkitgtk-6.0-4 libsoup-3.0-0 xvfb x11-xkb-utils openbox pulseaudio gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio gstreamer1.0-libav desktop-file-utils shared-mime-info libglib2.0-bin libdbusmenu-glib4 avahi-daemon dbus openbox gnome-sushi sway
      - name: Allow WebKit's sandbox on the runner
        run: |
          # Ubuntu restricts unprivileged user namespaces. Grant bubblewrap that permission so WebKit can keep its sandbox enabled.
          sudo tee /etc/apparmor.d/nsgo-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile nsgo-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/nsgo-ci-bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / /usr/bin/true
      - name: Start a virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nsgo_test
          pactl set-default-sink nsgo_test
      - name: Test
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          PULSE_SINK: nsgo_test
          NSGO_FILE_ASSOCIATIONS: '1'
          NSGO_REQUIRE_JDK: '1'
        # The shard's patterns are one run, so each package is built once and reported once.
        # examples/gallery runs its tests in sequence for about nine minutes on a hosted runner, beside the other packages, so go test's default ten-minute limit cuts it off.
        run: |
          xvfb-run -a go tool nsgo test ${{ matrix.packages }} -- -timeout=20m
  web:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test browser shader pixel frames
        run: go tool nsgo test -target web ./internal/testhost/testdata/shaderpixels
      - name: Test browser empty web sources
        run: go tool nsgo test -target web -run '^TestEmptyWebSourceIsOpaque$' ./internal/platform/web
      - name: Test browser press routing, modifiers and visible labels
        run: go tool nsgo test -target web ./internal/testhost/testdata/press
      - name: Test browser editing keys and bindings
        run: go tool nsgo test -target web ./internal/testhost/testdata/keys
      - name: Compare canvas atlas pixels in Chromium
        run: go tool nsgo test -target web -run '^TestCanvasAtlas(MatchesDrawImageFrom|Sampling)$' ./internal/testhost/testdata/capture
      - name: Test browser backend
        run: go tool nsgo test -target web ./internal/platform/web
      - name: Test browser raised sound limits
        run: go tool nsgo test -target web ./internal/testhost/testdata/soundlimits
      - name: Test the shared JavaScript API in Chromium
        run: go tool nsgo test -target web ./tsx/internal/js
      - name: Test the TSX runtime in Chromium
        run: go tool nsgo test -target web ./tsx
      - name: Test canvas image tint in Chromium
        run: go tool nsgo test -target web -run '^TestCanvasImageTint$' ./internal/testhost/testdata/capture
      - name: Test browser radio and tab focus
        run: go tool nsgo test -target web -run '^(TestRadioGroupIsOneStopItsArrowsMoveThrough|TestTabsTakeHomeEndAndSwapLeftAndRightRightToLeft)$' ./base
      - name: Test Chromium display frame timestamps
        run: go tool nsgo test -target web -timeout 1m ./internal/testhost/testdata/frameclock
      - name: Test browser DevTools presentation bounds
        run: go tool nsgo test -target web -timeout 1m ./testdata/devtools-geometry
      - name: Test browser package trust persistence
        run: go tool nsgo test -target web ./tsx/pkg

  # The runtime is built once here and both emulator jobs package it, so the APK
  # under test still comes from this commit's Java.
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Java for the Android runtime
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # The JDK the committed runtime is built with, so a rebuild of unchanged Java gives the same bytes.
          java-version: '21'
      - name: Build the Android runtime from this commit's Java
        # Pull requests no longer commit classes.dex and classes.jar (a release's changelog pull request or a bot/android-runtime one does, after merge), so the emulator tests package a runtime built from the sources under test rather than the committed one.
        run: |
          set -euo pipefail
          runtime=internal/platform/android/runtime
          .github/scripts/build-android-runtime.sh
          if ! git diff --quiet -- "$runtime/classes.dex" "$runtime/classes.jar"; then
            echo "::notice::The committed Android runtime differs from this commit's Java; the tests use the rebuilt one, which the next release's changelog pull request commits."
          fi
      - name: Keep the built Android runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-runtime
          path: |
            internal/platform/android/runtime/classes.dex
            internal/platform/android/runtime/classes.jar
          if-no-files-found: error
          retention-days: 14
  android-emulator-a:
    # Half of the emulator script, split by the time each invocation took: the E2E
    # pair and the platform suite are slower than the rest together.
    name: Android emulator (A)
    # The emulator needs KVM or Hypervisor.framework, which GitHub's runners have and Depot's lack.
    needs: android-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Take the built Android runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-runtime
          path: internal/platform/android/runtime
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          ndk: 27.2.12479018
          script: |
            NSGO_ANDROID_E2E=1 NSGO_ANDROID_DEVICE=emulator-5554 go tool nsgo test -run '^TestAndroidProcessExitResults$' ./cmd/nsgo || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 2m ./internal/testhost/testdata/frameclock || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 10m -run '(^TestStandaloneReviewSDKClasses$)|(^TestCanvasAtlasWire$)|(^TestHardwareKeys|^TestTabBarBadgesNative$)|(^TestNotificationPressIntentsKeepCollidingIDs$)|(^TestTextRPC)|(^TestMountFlushesDeferredShaderPixels$|^TestSendExtended)|(^Test(DetachedViewReleasesWidgetsAndResyncsItsLiveGraph|EmbeddedVideoBackground(Playback|Surface))$)|(^TestNativeAndroid(Sound|PlaybackControls|Player|OutputLatency)$)|(ListTouchStopsMomentum$)|(^TestIME|^TestHardwareEnter|^TestImmersiveAndroidSystemBars$)|(^TestDirectionMirrorsNativeControls$)' ./internal/platform/android || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 5m -run '(^TestCanvasAtlas(MatchesDrawImageFrom|Sampling)$)|(^TestClipKeepsOuterDecoration$)|(^TestCanvasImageTint$)|(^TestCanvasResolutionScale$)' ./internal/testhost/testdata/capture || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            NSGO_ANDROID_E2E=1 NSGO_ANDROID_DEVICE=emulator-5554 go tool nsgo test -run '^TestAndroidNativePackagedView$' ./cmd/nsgo || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
  android-emulator-b:
    name: Android emulator (B)
    # The emulator needs KVM or Hypervisor.framework, which GitHub's runners have and Depot's lack.
    needs: android-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Take the built Android runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-runtime
          path: internal/platform/android/runtime
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          ndk: 27.2.12479018
          script: |
            go tool nsgo test -target android -device emulator-5554 -timeout 2m ./testdata/devtools-geometry || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 2m -run '^TestGreets$' ./examples/hello || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 2m ./internal/testhost/testdata/press || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 3m -run '^Test(Mobile|Android)HardwareKey|^TestPressedPositionsReachTheApp$' ./internal/testhost/testdata/keys || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 2m ./internal/testhost/testdata/soundlimits || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 2m ./internal/testhost/testdata/websource || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 2m ./internal/testhost/testdata/webhistory || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 3m -fps -env NSGO_GALLERY_PERF=1 -env NSGO_GALLERY_PERF_SECONDS=3 -run '^TestPerfCanvas(Sprites|Mesh)' ./examples/gallery || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 2m ./internal/testhost/testdata/network || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }
            go tool nsgo test -target android -device emulator-5554 -timeout 2m ./internal/testhost/testdata/shaderpixels || { adb logcat -d -v brief -s nsgo:V AndroidRuntime:E libc:F DEBUG:F; exit 1; }

  # The required check: it passes only when the runtime build and both emulators passed.
  android:
    needs: [android-runtime, android-emulator-a, android-emulator-b]
    if: ${{ !cancelled() }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every part to pass
        env:
          RUNTIME: ${{ needs.android-runtime.result }}
          EMULATOR_A: ${{ needs.android-emulator-a.result }}
          EMULATOR_B: ${{ needs.android-emulator-b.result }}
        run: |
          for result in "$RUNTIME" "$EMULATOR_A" "$EMULATOR_B"; do
            if [ "$result" != "success" ]; then
              echo "::error::A part of android did not pass: $result."
              exit 1
            fi
          done
  apple:
    needs: changes
    # Skips a pull request that cannot affect Apple's targets (apple-changes.yml) unless all-jobs is set; a failed changes job runs it.
    if: ${{ !cancelled() && (inputs.all-jobs || needs.changes.outputs.apple != 'false') }}
    runs-on: depot-macos-26
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Grant the runner the microphone
        run: .github/scripts/grant-microphone.sh
      - name: Mark the job's start for crash reports
        run: touch "$RUNNER_TEMP/apple-start"
      - name: Vet
        run: go tool nsgo check ./internal/platform/apple
      - name: Test
        env:
          GOTRACEBACK: crash
        run: go tool nsgo test -ldflags '-s=false -w=false' ./internal/platform/apple -- -count=1
      - name: Test widget and Live Activity recording
        run: go tool nsgo test -run '^(TestWidgetTimelines|TestLiveActivityRecords|TestUnavailableWidgetServices)$' ./nsgotest
      - name: Test main-thread failure propagation
        run: go tool nsgo test -run '^TestOnMainExitPropagation$' ./internal/platform/macos -- -race
      - name: Test public unified-log diagnostics
        run: go tool nsgo test -env NSGO_TEST_UNIFIED_LOG=1 ./internal/platform/applelog
      - name: Test macOS backend
        run: go tool nsgo test ./internal/platform/macos
      - name: Test native input isolation
        run: go tool nsgo test -target macos ./testdata/inputisolation
      - name: Test terminal mouse routing
        run: go tool nsgo test -target macos -run '^(TestViewReportsRequestedMouseEvents|TestMouseReportingPreferenceRestoresSelection|TestMousePixelProtocolUsesRenderedCoordinates|TestShiftKeepsSelectionWhileMouseReportsEnabled|TestTerminalNativeMouseAndTouchpad)$' -screenshots terminal-mouse-screenshots ./base/terminal
      - name: Keep terminal input screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-mouse-macos
          path: terminal-mouse-screenshots
          if-no-files-found: warn
      - name: Test macOS DevTools presentation bounds
        run: go tool nsgo test -target macos -timeout 1m ./testdata/devtools-geometry
      - name: Test keyboard activation
        env:
          NSGO_TARGET_E2E: "1"
        run: go tool nsgo test -run '^TestMacOSActivationEndToEnd$' ./cmd/nsgo
      - name: Stress Objective-C blocks under GC and the race detector
        env:
          GOGC: "1"
        run: go tool nsgo test ./internal/platform/objcblock -- -race
      - name: Stress window observers in fresh processes
        env:
          GOGC: "1"
        run: go tool nsgo test -run '^TestWindowObserversSurviveGC$' ./internal/platform/macos -- -race -timeout=180s
      - name: Test native press routing, modifiers and visible labels
        run: go tool nsgo test -target macos ./internal/testhost/testdata/press
      - name: Test macOS display frame timestamps
        run: go tool nsgo test -target macos -timeout 1m ./internal/testhost/testdata/frameclock
      - name: Test native editing keys and bindings
        run: go tool nsgo test -target macos ./internal/testhost/testdata/keys
      - name: Test native web sources and restricted history
        run: |
          go tool nsgo test -target macos ./internal/testhost/testdata/websource
          go tool nsgo test -target macos ./internal/testhost/testdata/webhistory
      - name: Test native photo pick answers
        run: go tool nsgo test -target macos ./internal/testhost/testdata/pick
      - name: Test native window visibility
        run: go tool nsgo test -target macos -run TestWindowStateReadsNativeVisibility ./internal/testhost/testdata/windowstate
      - name: Test native radio and tab focus
        run: go tool nsgo test -target macos -run '^(TestRadioGroupIsOneStopItsArrowsMoveThrough|TestTabsTakeHomeEndAndSwapLeftAndRightRightToLeft)$' ./base
      - name: Test native shader pixel frames
        run: go tool nsgo test -target macos -activate ./internal/testhost/testdata/shaderpixels
      - name: Test composited captures
        run: go tool nsgo test -target macos ./internal/testhost/testdata/capture
      - name: Test pull PCM audio
        run: go tool nsgo test -target macos ./internal/testhost/testdata/audiooutput
      - name: Print crash reports
        if: failure()
        run: |
          # ReportCrash writes a report a few seconds after the process dies.
          sleep 20
          for reports in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [[ -d "$reports" ]]; then
              find "$reports" -type f -newer "$RUNNER_TEMP/apple-start" \( -name '*.ips' -o -name '*.crash' \) -print -exec cat {} \;
            fi
          done

  # The stress loop below starts a fresh process 200 times and takes about 6m41s, while the rest of the apple job takes about 4 minutes beside it.
  apple-stress:
    needs: changes
    # Skips a pull request that cannot affect Apple's targets (apple-changes.yml) unless all-jobs is set; a failed changes job runs it.
    if: ${{ !cancelled() && (inputs.all-jobs || needs.changes.outputs.apple != 'false') }}
    runs-on: depot-macos-26
    timeout-minutes: 30
    # The 200 fresh processes are independent, so two runners take 100 each and
    # the job ends in about half the time; each half still reports its crashes.
    strategy:
      fail-fast: false
      matrix:
        half: [1, 2]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Grant the runner the microphone
        run: .github/scripts/grant-microphone.sh
      - name: Mark the job's start for crash reports
        run: touch "$RUNNER_TEMP/apple-start"
      # Load AuthenticationServices before playback, as in the failed suite (#801).
      - name: Stress overlapping sound playback in fresh processes
        env:
          GOTRACEBACK: crash
          HALF: ${{ matrix.half }}
        run: |
          first=$(( (HALF - 1) * 100 + 1 ))
          last=$(( HALF * 100 ))
          for i in $(seq $first $last); do
            go tool nsgo test -ldflags '-s=false -w=false' -run '^(TestAuthenticationServicesLoads|TestASoundDecodesOnceAndPlaysOverlapping)$' \
              ./internal/platform/apple -- -count=1 -timeout=30s || { echo "run $i failed"; exit 1; }
          done
      - name: Print crash reports
        if: failure()
        run: |
          # ReportCrash writes a report a few seconds after the process dies.
          sleep 20
          for reports in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [[ -d "$reports" ]]; then
              find "$reports" -type f -newer "$RUNNER_TEMP/apple-start" \( -name '*.ips' -o -name '*.crash' \) -print -exec cat {} \;
            fi
          done
  apple-simulator:
    needs: changes
    # Runs only in the merge queue, by hand and for a release, never on a pull request: the organization has one depot-macos-15 runner, and pull request runs queued ahead of merge groups made every group time out. A skipped job counts as passed, so the pull request still reaches the queue, and an Apple failure there removes it from the batch. In the queue it still skips a change that cannot affect Apple's targets (apple-changes.yml); a failed changes job runs it. all-jobs runs it whatever the event and the change.
    if: ${{ !cancelled() && (inputs.all-jobs || (github.event_name != 'pull_request' && needs.changes.outputs.apple != 'false')) }}
    runs-on: depot-macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test simulator process results
        env:
          NSGO_SIMULATOR_E2E: "1"
        run: |

          # Booting a simulator on a hosted runner takes from about three to ten minutes, and the three cases run in one package, so go test's default ten-minute limit can end the last case before it starts.
          go tool nsgo test -run '^(TestSimulatorProcessResults|TestIOSSimulatorDevEndToEnd)$' ./cmd/nsgo -- -timeout=25m
          go tool nsgo test -run '^TestIOSDocumentTypesEndToEnd$' ./cmd/nsgo -- -timeout=15m
          go tool nsgo test -target ios_simulator -timeout 1m -run '^(TestFoldGeometry|TestSceneReconnectKeepsTheEngine|TestIOSVideoSeekWithSeparateAudio|TestTabBarRetitlesUIKitItemsInPlace|TestTabBarSizeFollowsAttachmentAndPlacement|TestTabBarNativeInsetsFollowPlacement|TestRichEditorNativeTouchEditMenu|TestRotationPublishesSizeAndSafeAreaTogether|TestImmersiveIOSSystemBars|TestOpenedDocumentIsAnIndependentCoordinatedCopy|TestOpenedDocumentsRefuseDirectoriesAndMissingFiles|TestSceneOpenedDocumentsStaySeparateFromLinks|TestSceneConnectionDocumentsWaitForTheFirstHandler|TestDirectionMirrorsUIKitControls)$' ./internal/platform/ios
          # An iPhone shows one scene at a time, so the tests of several run on an iPad: the newest iOS runtime's first.
          ipad=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS"))] | sort_by(.key | split("-") | .[1:] | map(tonumber)) | reverse | map(.value[] | select(.deviceTypeIdentifier | contains("iPad"))) | first | .udid')
          # The release run timed out after launch in the first test to open a second scene on a freshly booted iPad (#2431).
          # Budget that cold multi-scene test separately; the other iPad tests still get one minute.
          go tool nsgo test -target ios_simulator -device "$ipad" -timeout 2m -run '^TestScenesShowTreesOfTheirOwn$' ./internal/platform/ios
          go tool nsgo test -target ios_simulator -device "$ipad" -timeout 1m -run '^(TestSceneDisconnectsWhileTheOtherRuns|TestSceneStatusBarAndOrientationsArePerScene|TestSceneKeyboardInsetFollowsFocus|TestTitledKeyCommandsUseUIKit)$' ./internal/platform/ios
          # iPadOS 26's double-tap interaction on every window cancelled a double tap's second touch.
          go tool nsgo test -target ios_simulator -device "$ipad" -timeout 1m -run '^TestPressesCountConsecutiveClicks$' ./internal/testhost/testdata/press
          # Without -device, nsgo test takes a booted simulator, which would be the iPad rather than the iPhone the commands below are for.
          xcrun simctl shutdown "$ipad"
          go tool nsgo test -target ios_simulator -timeout 1m ./internal/testhost/testdata/websource
          go tool nsgo test -target ios_simulator -timeout 1m ./internal/testhost/testdata/webhistory
          go tool nsgo test -target ios_simulator -timeout 1m ./internal/testhost/testdata/deviceidentity
          go tool nsgo test -target ios_simulator -timeout 1m -run '^TestKeyCodesFollowPositionsOnIOS$' ./internal/testhost/testdata/keys
          go tool nsgo test -target ios_simulator -timeout 2m -run '^Test(IOSCaptureIsSRGB|Apple(Content|Native|Image|Scroll)ClipKeepsOuterDecoration)$' ./internal/testhost/testdata/capture
          go tool nsgo test -target ios_simulator -timeout 1m -run '^Test(Scroll|List)PastItsEndComesBackToIt$' ./nsgotest
          go tool nsgo test -target ios_simulator -timeout 1m ./internal/testhost/testdata/frameclock
          go tool nsgo test -target ios_simulator -timeout 1m -run '^TestCanvasAtlas(MatchesDrawImageFrom|Sampling)$' ./internal/testhost/testdata/capture
          go tool nsgo test -target ios_simulator -timeout 1m -run '^TestPressAtFindsZoomedScrollContent$' ./internal/testhost/testdata/press
          go tool nsgo test -target ios_simulator -timeout 1m ./internal/testhost/testdata/audio
          go tool nsgo test -target ios_simulator -timeout 1m -run '^TestCanvasImageTint$' ./internal/testhost/testdata/capture
          go tool nsgo test -target ios_simulator -timeout 1m ./testdata/devtools-geometry
          go tool nsgo test -target ios_simulator -timeout 1m ./internal/testhost/testdata/audiooutput
          go tool nsgo test -target ios_simulator -timeout 2m ./internal/testhost/testdata/shaderpixels
          go tool nsgo test -target ios_simulator -timeout 1m -run '^(TestPanEndsAtTheLastOffset|TestPinchReportsScaleAndPhase|TestPressesCountConsecutiveClicks)$' ./internal/testhost/testdata/press
          go tool nsgo test -target ios_simulator -timeout 1m -run '^TestTabBarBadgesNative$' ./internal/platform/ios
          go tool nsgo test -target watchos_simulator -timeout 1m ./internal/platform/watchos
          go tool nsgo test -target watchos_simulator -timeout 1m ./internal/testhost/testdata/deviceidentity
          go tool nsgo test -target watchos_simulator -timeout 1m ./testdata/devtools-geometry

  # The job below used to run all of it: 8m02s of wall clock for 6m47s of steps.
  # Split by each step's measured time, the halves take 3m24s and 3m23s, so two
  # runners finish in about the time of the longer half.
  windows-tests-a:
    name: Windows tests (A)
    runs-on: depot-windows-2025-4
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native press routing, modifiers and visible labels
        run: go tool nsgo test -target windows ./internal/testhost/testdata/press
      - name: Test the Windows backend's logic
        # The package's other tests drive native windows and run one by one below; the logic tests (logic_test.go and *_logic_test.go) need none and otherwise run nowhere.
        shell: bash
        run: |
          tests=$(grep -ho '^func Test[A-Za-z0-9_]*' internal/platform/windows/logic_test.go internal/platform/windows/*_logic_test.go | sed 's/^func //' | paste -sd '|')
          go tool nsgo test -run "^($tests)\$" ./internal/platform/windows -- -count=1
      - name: Test unpackaged startup task failures
        run: go tool nsgo test -run '^TestStartupTaskRejectsUnpackaged$' ./internal/platform/windows -- -count=1
      - name: Test system keys in embedded Windows views
        run: go tool nsgo test -run '^TestEmbeddedSystemKeysReachTheApp$' ./internal/platform/windows
      - name: Test native web sources and restricted history
        run: |
          go tool nsgo test -target windows ./internal/testhost/testdata/websource
          go tool nsgo test -target windows ./internal/testhost/testdata/webhistory
      - name: Test native photo pick answers
        run: go tool nsgo test -target windows ./internal/testhost/testdata/pick
      - name: Test native raised sound limits
        run: go tool nsgo test -target windows ./internal/testhost/testdata/soundlimits
      - name: Test native video controls and retained playback
        run: go tool nsgo test -run '^TestVideoControlsReportAndHoldPlayback$' ./internal/platform/windows
      - name: Test widget and Live Activity recording
        run: go tool nsgo test -run '^(TestWidgetTimelines|TestLiveActivityRecords|TestUnavailableWidgetServices)$' ./nsgotest
      - name: Test native focus, styles, activation and label relationships
        run: go tool nsgo test -run '^(TestRefFocusUsesNativeKeyboardStops|TestNativeLabeledByProvider)$' ./internal/platform/windows
      - name: Test native clipboard representations
        run: go tool nsgo test -run '^TestNativeClipboardItems$' ./internal/platform/windows
      - name: Test native dev window frame and full screen
        run: go tool nsgo test -run '^TestDevWindowFrameRestoresPlacementAndFullScreen$' ./internal/platform/windows -- -tags=nsgodev
      - name: Test retained image bytes and current shader textures
        run: go tool nsgo test -run '^(TestCanvasImageCacheByteBudgetAndReconfiguration|TestShaderViewsKeepOnlyTheirImages|TestShaderTextureCacheBoundsLRUPinsAndRelease)$' ./internal/platform/windows
      - name: Test Windows owned-window visibility and minimization
        run: go tool nsgo test -run '^TestOwnedWindowsFollowVisibility$' ./internal/platform/windows -- -count=1
      - name: Test Windows audio
        run: go tool nsgo test -trace -run '^TestWindowsAudio' ./internal/platform/windows
      - name: Test Windows menu visibility after Alt shortcuts
        run: go tool nsgo test -run '^TestConsumedAltChordKeepsMenusClosed$' ./internal/platform/windows
      - name: Test menu yield with a focused WebView2 page
        run: go tool nsgo test -run '^TestMenuYieldFollowsNativeFocus$' ./internal/platform/windows
      - name: Test WebView2 history and navigation state
        run: go tool nsgo test -run '^(TestWebOwnPagesReloadAndReturn|TestWebNavigationStateTracksPageEdits)$' ./internal/platform/windows
      - name: Test WebView2 custom scheme requests and responses
        run: go tool nsgo test -run '^TestWebSchemeRequestAnswers$' ./internal/platform/windows
      - name: Test notification IDs and native toast identities
        run: go tool nsgo test -run '^TestToast' ./internal/platform/windows
      - name: Test instance isolation and file handoff
        run: go tool nsgo test -run '^TestInstance' ./internal/platform/windows
      - name: Test explicit full screen and restoration
        run: go tool nsgo test -run '^TestExplicitFullScreenRestoresWindowFrame$' ./internal/platform/windows
      - name: Test process and automation sessions
        run: go tool nsgo test -run '^(TestProcessAlive.*|TestAutomationSessionFile|TestMCPSessionBridge|TestCheckDevAutomation|TestDevAutomationRefusesWhatItCannotDrive)$' ./cmd/nsgo
      - name: Test Windows automation live surfaces
        run: go tool nsgo test ./internal/platform/windows -- -tags=nsgoautomation -run '^TestLiveSurfaceTracking$'
  windows-tests-b:
    name: Windows tests (B)
    runs-on: depot-windows-2025-4
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native local service discovery
        run: go tool nsgo test -target windows -timeout 1m ./internal/testhost/testdata/discovery
      - name: Test native editing keys and bindings
        run: go tool nsgo test -target windows ./internal/testhost/testdata/keys
      - name: Test physical key names on AZERTY and QWERTZ layouts and modifier sides
        run: go tool nsgo test -run '^(TestLayoutCodeNamesFollowTheLayout|TestTestHostKeyPositionsHoldTheirOwnSide)$' ./internal/platform/windows -- -count=1
      - name: Test WinSparkle quit approval and callback cleanup
        run: go tool nsgo test -run '^TestWinSparkleQuit' ./internal/platform/windows -- -count=1
      - name: Test native file preview rendering and keyboard forwarding
        run: go tool nsgo test -run '^(TestRegisteredTextPreviewHandler|TestPreviewFrameCOM|TestNativePreviewSelectionAndClose)$' ./internal/platform/windows -- -count=1 -timeout=90s
      - name: Test Windows DevTools presentation bounds
        run: go tool nsgo test -target windows -timeout 1m ./testdata/devtools-geometry
      - name: Test native canvas image tint
        run: go tool nsgo test -run '^TestCanvasImageTint$' ./internal/platform/windows
      - name: Test native window visibility
        run: go tool nsgo test -target windows -run TestWindowStateReadsNativeVisibility ./internal/testhost/testdata/windowstate
      - name: Compare Direct2D atlas pixels in direct and cached drawing
        run: go tool nsgo test -run '^TestCanvasAtlasDrawsLikeImages$' ./internal/platform/windows
      - name: Run the many-sprite and mesh canvas scenarios
        env:
          NSGO_GALLERY_PERF: '1'
          NSGO_GALLERY_PERF_SECONDS: '3'
        run: go tool nsgo test -target windows -fps -run '^TestPerfCanvas(Sprites|Mesh)' ./examples/gallery
      - name: Test UI Automation property-changed events
        run: go tool nsgo test -run '^TestUIAPropertyChangedEvents$' ./internal/platform/windows
      - name: Test the save dialog's starting folder
        run: go tool nsgo test -run '^TestSaveDialogStartsInFolder$' ./internal/platform/windows
      - name: Test WebView2 popup requests
        run: go tool nsgo test -run '^TestWebView2WindowRequests$' ./internal/platform/windows
      - name: Test Windows shader pixel frames
        run: go tool nsgo test -target windows ./internal/testhost/testdata/shaderpixels
      - name: Test pixel frames and animated images
        run: go tool nsgo test -run '^(TestPixelFramesShowEachFrame|TestAnimatedGIFAndSVGImagesDraw)$' ./internal/platform/windows
      - name: Test Windows last-window close and session end
        run: go tool nsgo test -run '^TestWindows(LastWindowAsksBeforeQuitting|SessionEndForcesQuit)$' ./internal/platform/windows
      - name: Test pointer lock preserves the process's Raw Input registration
        run: go tool nsgo test -run '^TestPointerLockKeepsRawMouseRegistration$' ./internal/platform/windows
      - name: Test menu yield to the shortcuts the menu leaves a focused field
        run: go tool nsgo test -run '^TestMenuYieldReachesTheBindingTheMenuLeaves$' ./internal/platform/windows
      - name: Test WebView2 accelerator shortcuts
        run: go tool nsgo test -run '^TestFocusedPageKeysReachShortcutsFirst$' ./internal/platform/windows
      - name: Test Edit menu roles in a focused WebView2 page and their OnSelect fallback
        run: go tool nsgo test -run '^(TestEditMenuEditsTheFocusedPage|TestWebEditCommandsCoverTheEditingRoles|TestEditingRolesFallBackToOnSelect)$' ./internal/platform/windows
      - name: Test native radio and tab focus
        run: go tool nsgo test -target windows -run '^(TestRadioGroupIsOneStopItsArrowsMoveThrough|TestTabsTakeHomeEndAndSwapLeftAndRightRightToLeft)$' ./base
      - name: Test native direction mirroring
        run: go tool nsgo test -run '^TestDirectionMirrorsNativeControls$' ./internal/platform/windows
      - name: Test native network reachability
        run: go tool nsgo test -run '^TestNetworkMonitorReadsNetworkListManager$' ./internal/platform/windows
      - name: Test Windows automation end to end
        env:
          NSGO_AUTOMATION_E2E: '1'
        run: go tool nsgo test -run '^TestAutomationEndToEnd$' ./cmd/nsgo
      - name: Test document registration and installer cleanup
        env:
          NSGO_FILE_ASSOCIATIONS: '1'
        run: go tool nsgo test -run 'FileAssociations|FileTypes|URLSchemes|WindowsInstaller' ./cmd/nsgo
      - name: Test the Windows installer runtime's cleanup
        run: go tool nsgo test -run 'UninstallerCleanup' ./cmd/nsgo/windowsinstaller

  # The required check: it passes only when both halves passed.
  windows:
    needs: [windows-tests-a, windows-tests-b]
    if: ${{ !cancelled() }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both halves to pass
        env:
          TESTS_A: ${{ needs.windows-tests-a.result }}
          TESTS_B: ${{ needs.windows-tests-b.result }}
        run: |
          for result in "$TESTS_A" "$TESTS_B"; do
            if [ "$result" != "success" ]; then
              echo "::error::A half of windows did not pass: $result."
              exit 1
            fi
          done
  terminal:
    name: Terminal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
    runs-on: ${{ matrix.os == 'macos' && 'macos-15-intel' || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 15
    env:
      TERM: xterm-256color
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test terminal cells and input under a PTY
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ]; then
            script -q /dev/null go tool nsgo test -target tui ./examples/tui
          else
            script -q -e -c 'go tool nsgo test -target tui ./examples/tui' /dev/null
          fi
