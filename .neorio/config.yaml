icon: examples/gallery/assets/Icon.png
tasks:
  - label: Run
    group: run
    command: go
    args: [tool, nsgo, dev, -fps, examples/gallery]
  - label: Build
    group: build
    command: go
    args: [tool, nsgo, build, examples/gallery]
  - label: Website dev
    type: shell
    command: go tool nsgo dev -target web examples/gallery
worktree:
  copy:
    - nsh
