updateAvailable:
  message: "A new version of {app} is available"
  description: The title of the alert offering a newer version of the app.
updateAvailableMessage:
  message: "{app} {version} is available. You have {current}."
  description: The alert offering a newer version, which names it and the running one.
update:
  message: "Update"
  description: The button of the alert offering a newer version, which installs it, or opens its page in the App Store or a browser.
later:
  message: "Later"
  description: The button closing the alert offering a newer version.
upToDate:
  message: "You’re up to date"
  description: The title of the alert saying no newer version of the app exists.
upToDateMessage:
  message: "{app} {version} is the newest version available."
  description: The alert saying no newer version exists, which names the running one.
updateError:
  message: "Can’t check for updates"
  description: The title of the alert saying the check for a newer version failed.
updateErrorMessage: "Something went wrong while checking for updates. Try again later."
installError:
  message: "Can’t install the update"
  description: The title of the alert saying the newer version the user chose to install could not be downloaded or installed.
installErrorMessage:
  message: "{app} {version} couldn’t be downloaded or installed. You can get it from its page instead."
  description: The alert saying the newer version could not be installed, which names it and offers its page.
openPage:
  message: "Open Page"
  description: The button of the alert saying the newer version could not be installed, which opens its page in a browser.
ok: "OK"
updateDevelopment: "This is a development build. It does not update itself."
updateChannel: "This build is updated through its distribution channel, not this app."
updateStore: "{store} installed this app and manages its updates."
