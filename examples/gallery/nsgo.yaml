name: Gallery
id: dev.oneo.nsgo.gallery
version: 0.1.0

dev:
  target: native

widgets:
  - kind: activity
    name: Activity
    description: The day's steps toward a goal, in every size.
    families: [small, medium, large, extra_large, circular, rectangular, inline]
  - kind: photo
    name: Photo
    description: The date over a picture the gallery draws.
    families: [small, medium, large, extra_large]

live_activities:
  enabled: true

build:
  output: dist
  open: true
  targets: [all, harmonyos]

apple:
  purchases: true
  info:
    NSMicrophoneUsageDescription: The System page dictates what you say.
    NSSpeechRecognitionUsageDescription: The System page turns what you say into text.
    NSCameraUsageDescription: The System page takes a photo with the camera.
    NSLocationWhenInUseUsageDescription: The System page shows location fixes when you request them.
    NSLocationUsageDescription: The System page shows location fixes when you request them.
    NSMotionUsageDescription: The System page shows motion samples when you start a sensor.
    UIBackgroundModes: [location]
    NSFaceIDUsageDescription: The System page asks for Face ID to show the prompt.
    NSCalendarsFullAccessUsageDescription: The System page shows how the app asks for your calendars.
    NSCalendarsUsageDescription: The System page shows how the app asks for your calendars.
    NSRemindersFullAccessUsageDescription: The System page shows how the app asks for your reminders.
    NSRemindersUsageDescription: The System page shows how the app asks for your reminders.
    NSBluetoothAlwaysUsageDescription: The System page shows how the app asks for Bluetooth.
    NSAppleMusicUsageDescription: The System page shows how the app asks for your media library.
    NSLocalNetworkUsageDescription: The System page shows how the app asks for the local network.

android:
  permissions: [POST_NOTIFICATIONS, USE_BIOMETRIC, RECORD_AUDIO, CAMERA, READ_CALENDAR, WRITE_CALENDAR, BLUETOOTH_CONNECT, BLUETOOTH, READ_MEDIA_AUDIO, READ_EXTERNAL_STORAGE, ACCESS_COARSE_LOCATION, ACCESS_FINE_LOCATION, FOREGROUND_SERVICE, FOREGROUND_SERVICE_LOCATION]
