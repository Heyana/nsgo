<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NSGo — Native UI, written in Go</title>
    <meta
      name="description"
      content="NSGo is a cross-platform native UI engine written in Go. Signals, layout and text run in Go; iOS, Android, macOS, Windows, Linux and the web draw with their own native views."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1a1816" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="canonical" href="https://oneo-me.github.io/nsgo/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oneo-me.github.io/nsgo/" />
    <meta property="og:title" content="NSGo — Native UI, written in Go" />
    <meta
      property="og:description"
      content="A cross-platform native UI engine with a Go backend, from the design of Native Shell."
    />
    <meta property="og:image" content="https://oneo-me.github.io/nsgo/icon.png" />
    <meta property="og:image:alt" content="The NSGo mark" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Set the appearance before the first paint. `nsgo-theme` holds
      // system, light or dark; absent follows the system.
      (function () {
        var pref = 'system';
        try {
          var stored = localStorage.getItem('nsgo-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') pref = stored;
        } catch (error) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#1a1816' : '#f5f3ef');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
